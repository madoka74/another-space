name: AnotherSpace
options:
  bundleIdPrefix: com.blankishworks
  deploymentTarget:
    visionOS: "2.0"
targets:
  # 비전프로 전용 앱
  AnotherSpace:
    type: application
    platform: visionOS
    sources:
      - path: AnotherSpace
        excludes: ["Resources/**", "Sounds/**"]
      # 바닥·벽 무늬, 하늘 그림 (폴더 그대로 앱에 담음: 앱 안 tex/, sky/)
      # 앱 맨 위에 'Resources'라는 폴더를 두면 서명이 실패함(맥 앱 구조로 오해) → 두 폴더를 따로 담음
      - path: AnotherSpace/Resources/tex
        type: folder
        buildPhase: resources
      - path: AnotherSpace/Resources/sky
        type: folder
        buildPhase: resources
      # 엠비언트 소리 (빌드할 때 엠비언트의 목록과 R2 소리 파일을 받아 담음 → 앱 안 Sounds/)
      - path: AnotherSpace/Sounds
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blankishworks.another-space
        PRODUCT_NAME: AnotherSpace
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "7"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: AnotherSpace/Info.plist
      properties:
        CFBundleDisplayName: 어나더 스페이스
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSWorldSensingUsageDescription: 집 안의 바닥·벽·가구 모양을 알아보고, 그 위에 다른 세계(숲·바다·도시 등)를 정확히 입히는 데 사용합니다. 공간 정보는 기기 안에만 저장됩니다.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
